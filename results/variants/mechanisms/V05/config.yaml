      free_energy_threshold: 5000.0
      tracking_q:
      - 4
      - 8
      - 6
      - 2
      - 2
      - 1
      - 1
      tracking_r:
      - 1
      - 1
      tracking_terminal_multiplier: 5.0
    cc_mppi:
      uncontrolled_fraction: 0.2
      noise_ratio: 100.0
      terminal_covariance_bound:
      - 1.0
      - 1.0
      - 0.25
      - 0.04
      - 1.0
      - 0.5
      - 0.5
      covariance_q:
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
      covariance_r:
      - 1
      - 1
      cc_control_r:
      - 0.01
      - 0.01
      covariance_tolerance: 1.0e-05
  studies:
    V01_tsallis:
      algorithms:
      - it_mppi
      - tsallis_vi
      scenarios:
      - open_space
      - two_route_obstacle
    V02_dial:
      algorithms:
      - it_mppi
      - dial_mpc
      - dial_no_anneal
      scenarios:
      - two_route_obstacle
      - narrow_passage
    V03_tube:
      algorithms:
      - it_mppi
      - tube_mppi
      scenarios:
      - disturbance
      - model_mismatch
    V04_robust:
      algorithms:
      - it_mppi
      - robust_mppi
      scenarios:
