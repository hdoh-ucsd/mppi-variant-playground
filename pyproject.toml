[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mppi-variant-playground"
version = "0.1.0"
description = "Unified reproducible CPU toy experiments for MPPI covariance structures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.9", "pyyaml>=6", "pandas>=2.2", "imageio>=2.34", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/analysis",
    "src/controllers",
    "src/costs",
    "src/dynamics",
    "src/evaluation",
    "src/sampling",
    "src/scenarios",
    "src/utils",
    "src/visualization",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
