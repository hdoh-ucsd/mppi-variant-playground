phase: evaluation
workers: 8
seeds: [48000, 48001, 48002]
calibration_seeds: [47900, 47901, 47902]
calibration_samples: [16, 32, 64, 128, 256, 384, 768, 1536, 3072]
planning_deadline_s: 0.15
calibration_fraction: 0.8
transition_budget: 7700
s_turn_clearance: 0.35
algorithms:
  it_mppi: {}
  tsallis_vi: {tsallis_r: 1.5, elite_fraction: 0.8}
  dial_mpc: {iterations: 4, beta_trajectory: 1.0, beta_horizon: 1.0, anneal: true, covariance: [[0.2, 0], [0, 0.2]]}
  dial_no_anneal: {iterations: 4, beta_trajectory: 1.0, beta_horizon: 1.0, anneal: false, covariance: [[0.2, 0], [0, 0.2]]}
  tube_mppi: {reset_threshold: 450.0, tracking_q: [4, 8, 6, 2, 2, 1, 1], tracking_r: [1, 1], tracking_terminal_multiplier: 5.0}
  robust_mppi: {candidate_samples: 8, free_energy_threshold: 5000.0, tracking_q: [4, 8, 6, 2, 2, 1, 1], tracking_r: [1, 1], tracking_terminal_multiplier: 5.0}
  cc_mppi:
    uncontrolled_fraction: 0.2
    noise_ratio: 100.0
    terminal_covariance_bound: [1.0, 1.0, 0.25, 0.04, 1.0, 0.5, 0.5]
    covariance_q: [1, 1, 1, 1, 1, 1, 1]
    covariance_r: [1, 1]
    cc_control_r: [0.01, 0.01]
    covariance_tolerance: 0.00001
studies:
  V01_tsallis:
    algorithms: [it_mppi, tsallis_vi]
    scenarios: [open_space, two_route_obstacle]
  V02_dial:
    algorithms: [it_mppi, dial_mpc, dial_no_anneal]
    scenarios: [two_route_obstacle, narrow_passage]
  V03_tube:
    algorithms: [it_mppi, tube_mppi]
    scenarios: [disturbance, model_mismatch]
  V04_robust:
    algorithms: [it_mppi, robust_mppi]
    scenarios: [disturbance, model_mismatch]
  V05_covariance_steering:
    algorithms: [it_mppi, cc_mppi]
    scenarios: [open_space, narrow_passage]
    stochastic_input_fraction: 0.01
