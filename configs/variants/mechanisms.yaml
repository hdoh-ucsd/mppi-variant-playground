phase: evaluation
source_seed: 49000
frozen_step: 8
seeds: [51000, 51001, 51002]
scenes: [open_space, two_route_obstacle, narrow_passage]
benchmark_config: configs/variants/benchmark.yaml
selection_rule: Fixed step 8 of IT-MPPI in each named scene; no selection using outcomes.
V01:
  scenes: [open_space, two_route_obstacle]
  samples: 384
  reference_cost_center: 1.0
  reference_scale: 0.8
  reference_r: 1.5
  reference_sample_counts: [128, 1024, 8192]
  reference_seeds: [52000, 52001, 52002]
V02:
  scene: two_route_obstacle
  iterations: 4
  samples_per_iteration: 95
  it_samples: 383
  transitions_per_decision: 7680
V03:
  scene: open_space
  samples: 64
  steps: 32
  disturbance_step: 8
  disturbance_delta: [0, 0.7, 0.10, 0.01, -0.2, 0.3, 0.12]
  disturbance_multipliers: [0, 1, -1]
  reset_thresholds: [450.0, 0.0]
  representative_rule: First evaluation seed, positive disturbance; show both thresholds and all signed/control cases in summaries.
V04:
  scene: open_space
  samples: 128
  disturbance_delta: [0, 0.7, 0.10, 0.01, -0.2, 0.3, 0.12]
  disturbance_multipliers: [0, 1, -1]
  free_energy_thresholds: [5000.0, 100.0]
  history_rule: Previous and propagated nominal states equal the frozen reference; previous and current plans equal its warm start.
  representative_rule: First evaluation seed, positive disturbance, threshold 100; not selected by performance or feasibility.
V05:
  scenes: [open_space, narrow_passage]
  planner_seed: 55000
  planner_samples: 384
  execution_seed_start: 56000
  execution_replicates: 256
  noise_fractions: [1.0, 0.01]
  feedback_modes: [steered, zero_gain]
  execution_rule: Fixed warm-start mean and precomputed gains; independent Gaussian noise drives auxiliary state and actual nonlinear plant. No replanning or optimization weights. Paired noise across feedback modes.
  contact_policy: Propagate the full fixed horizon even after proxy contact; record contacts, do not condition covariance on survival. The plant has no impact dynamics.
  normalization: Per-state square roots of the declared terminal covariance diagonal; positions also displayed in meters.
